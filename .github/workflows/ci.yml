name: CI
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax smoke (manager)
        run: |
          python3 -m py_compile manager/*.py
          echo "manager/*.py syntax OK"
      - name: Toolpkg integrity (download from Release)
        run: |
          TAG=v1.1.8
          curl -sSL -o /tmp/pkg.toolpkg "https://github.com/ymmhl91-bit/waifu-manager/releases/download/${TAG}/waifu-${TAG#v}.toolpkg"
          python3 - <<'PY'
          import zipfile, json
          z = zipfile.ZipFile('/tmp/pkg.toolpkg')
          assert z.testzip() is None, 'corrupt entry'
          m = json.loads(z.read('manifest.json'))
          assert m['toolpkg_id'] == 'com.operit.waifu'
          assert m['version'] == '1.1.8'
          print('toolpkg OK:', m['version'])
          PY
